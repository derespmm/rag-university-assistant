services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      # persist the ChromaDB vector store and uploaded syllabi between restarts
      - chroma_data:/app/backend/chroma_db
      - uploads_data:/app/backend/uploads
      # mount policy PDFs so you can ingest without rebuilding the image
      - ./data/policies:/app/data/policies
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
  uploads_data:
